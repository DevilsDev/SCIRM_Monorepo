# HIPAA Compliance Configuration for SCIRM Platform

apiVersion: v1
kind: ConfigMap
metadata:
  name: hipaa-compliance
  namespace: scirm-staging
data:
  # Administrative Safeguards
  administrative_safeguards.json: |
    {
      "security_officer": {
        "assigned": true,
        "responsibilities": ["policy_development", "incident_response", "compliance_monitoring"],
        "contact": "security@scirm.company.com"
      },
      "workforce_training": {
        "required": true,
        "frequency_months": 12,
        "topics": ["phi_handling", "access_controls", "incident_reporting"],
        "certification_required": true
      },
      "access_management": {
        "unique_user_identification": true,
        "automatic_logoff": true,
        "encryption_decryption": true,
        "role_based_access": true
      },
      "contingency_plan": {
        "data_backup": true,
        "disaster_recovery": true,
        "emergency_access": true,
        "testing_frequency_months": 6
      }
    }
  
  # Physical Safeguards
  physical_safeguards.json: |
    {
      "facility_access_controls": {
        "datacenter_security": "tier_3_certified",
        "access_logging": true,
        "visitor_controls": true,
        "maintenance_records": true
      },
      "workstation_use": {
        "authorized_access_only": true,
        "physical_security": true,
        "screen_locks": true,
        "clean_desk_policy": true
      },
      "device_controls": {
        "media_controls": true,
        "disposal_procedures": "dod_5220_22_m",
        "reuse_procedures": "secure_wiping",
        "accountability": "asset_tracking"
      }
    }
  
  # Technical Safeguards
  technical_safeguards.json: |
    {
      "access_control": {
        "unique_user_identification": true,
        "automatic_logoff_minutes": 15,
        "encryption_decryption": "AES-256",
        "role_based_access": true
      },
      "audit_controls": {
        "audit_logs": true,
        "log_retention_years": 6,
        "log_review_frequency": "daily",
        "automated_monitoring": true
      },
      "integrity": {
        "phi_alteration_protection": true,
        "digital_signatures": true,
        "checksums": true,
        "version_control": true
      },
      "person_authentication": {
        "multi_factor_authentication": true,
        "password_complexity": true,
        "account_lockout": true,
        "session_management": true
      },
      "transmission_security": {
        "end_to_end_encryption": true,
        "tls_version": "1.3",
        "certificate_validation": true,
        "secure_channels_only": true
      }
    }
  
  # PHI Handling Procedures
  phi_procedures.json: |
    {
      "minimum_necessary": {
        "access_limitation": true,
        "disclosure_limitation": true,
        "request_limitation": true,
        "automated_enforcement": true
      },
      "breach_notification": {
        "detection_procedures": "automated_monitoring",
        "notification_timeline_hours": 72,
        "risk_assessment_required": true,
        "documentation_required": true
      },
      "business_associate_agreements": {
        "required_for_vendors": true,
        "compliance_monitoring": true,
        "incident_reporting": true,
        "audit_rights": true
      },
      "patient_rights": {
        "access_to_phi": true,
        "amendment_requests": true,
        "accounting_of_disclosures": true,
        "complaint_procedures": true
      }
    }
  
  # Risk Assessment
  risk_assessment.json: |
    {
      "assessment_frequency": "annual",
      "methodology": "nist_cybersecurity_framework",
      "scope": ["technical", "administrative", "physical"],
      "risk_categories": {
        "confidentiality": ["unauthorized_access", "data_breach"],
        "integrity": ["data_modification", "system_corruption"],
        "availability": ["system_downtime", "service_disruption"]
      },
      "mitigation_strategies": {
        "high_risk": "immediate_action_required",
        "medium_risk": "action_plan_30_days",
        "low_risk": "monitor_and_review"
      }
    }
