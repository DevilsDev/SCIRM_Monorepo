server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Note: add_header in a location replaces (not extends) server-level headers,
    # so the security headers are repeated in each location.

    # Fingerprinted build assets can be cached for a long time.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html, which is never cached.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
