[build]
  base = "."
  publish = "site"
  command = "mkdocs build"

[build.environment]
  PYTHON_VERSION = "3.11"
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'"

# Prevent access to internal files
[[redirects]]
  from = "/dashboards/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/compliance/dashboards/*"
  to = "/404.html"
  status = 404

[context.production.environment]
  NETLIFY_SITE_ID = "scirm-platform"
