      - "127.0.0.1:8005:8000"
  risk-scorer:
    ports:
      - "127.0.0.1:8006:8000"
  discovery:
    ports:
      - "127.0.0.1:8007:8000"
  ingestion:
    ports:
      - "127.0.0.1:8008:8000"
  chat:
