site_name: SCIRM Documentation
site_url: https://scirm-dd5c3.web.app
use_directory_urls: true

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.path
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - macros:
      module_name: docs/main

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Introduction:
      - Overview: intro/overview.md
      - Getting Started: intro/getting-started.md
  - "Product":
      - "PRD": product/prd.md
      - "PDD": product/pdd.md
      - "Anti-Patterns & Guardrails": product/anti-patterns.md
  - "Roadmap":
      - "Development Roadmap": roadmap/roadmap.md
  - Architecture:
      - System Architecture: architecture/system-architecture.md
      - Database Design: architecture/database.md
      - Entity Relationships: architecture/er-diagram.md
      - Data Flows: architecture/dataflow.md
  - "Architecture Decisions":
      - "ADR Index": architecture/adr/index.md
  - "Security: Public-Safe":
      - "Security Overview": security/security-overview.md
  - "Compliance: Evidence Model":
      - "Documentation Policy": compliance/documentation-policy.md
      - "Evidence Model": compliance/evidence-model.md
  - Contributing:
      - Workflow: contributing/git-workflow.md
      - Commit Signing: contributing/commit-signing.md
      - Docs Style: contributing/docs-style.md
  - Release Notes:
      - Changelog: changelog/release-notes.md
  - Support:
      - FAQ: support/faq.md
      - Contact: support/contact.md

extra:
  generator: false
  github:
    repository: DevilsDev/SCIRM_Monorepo
    default_branch: main
    deploy_branch: firebase-hosting

copyright: "© SCIRM | Last Updated: {{ macros_info.build_date }} | Commit: {{ macros_info.git_short_commit }}"
