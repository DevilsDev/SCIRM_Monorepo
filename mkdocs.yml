site_name: SCIRM Documentation
site_url: https://scirm-dd5c3.web.app
use_directory_urls: true

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.path
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - macros:
      module_name: docs/main

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Introduction:
      - Overview: intro/overview.md
      - Getting Started: intro/getting-started.md
  - "Product":
      - "PRD": product/prd.md
      - "PDD": product/pdd.md
      - "Anti-Patterns & Guardrails": product/anti-patterns.md
  - "Roadmap":
      - "Development Roadmap": roadmap/roadmap.md
  - Architecture:
      - System Architecture: architecture/system-architecture.md
      - System Overview: architecture/system-overview.md
      - AI Agents: architecture/agents.md
      - Database Design: architecture/database.md
      - Performance: architecture/performance.md
      - Agent Sequences: architecture/agent-sequences.md
      - Entity Relationships: architecture/er-diagram.md
      - Data Flows: architecture/dataflow.md
      - Legacy Data Flows: architecture/data-flows.md
  - "Architecture Decisions":
      - "ADR Index": architecture/adr/index.md
      - "ADR-001: Multi-Agent Swarm": architecture/adr/ADR-001-multi-agent-swarm-architecture.md
      - "ADR-002: RAG Implementation": architecture/adr/ADR-002-rag-implementation-strategy.md
      - "ADR-003: Agent Communication": architecture/adr/ADR-003-agent-communication-protocol.md
      - "ADR-003: GitHub Pages Security": architecture/adr/ADR-003-secure-github-pages-publishing.md
      - "ADR-004: Data Governance": architecture/adr/ADR-004-data-governance-framework.md
      - "ADR-005: Branch Protection": architecture/adr/ADR-005-branch-protection-strategy.md
      - "ADR-006: Dashboard Isolation": architecture/adr/ADR-006-internal-dashboard-isolation.md
  - "Security":
      - "Security Overview": security/security-overview.md
      - "CAG Policies": security/cag-policies.md
      - "Firebase Branch Governance": security/Firebase-Deploy-Branch-Governance.md
      - "Compliance": security/compliance.md
      - "Security Details": security/overview.md
  - "Governance":
      - "Firebase Key Rotation": governance/firebase-key-rotation.md
      - "Verification Checklist": governance/verification-checklist.md
  - "Operations":
      - "Deployment Runbook": operations/runbooks/deployment-runbook.md
  - "Development":
      - "Branching Strategy": development/branching.md
      - "Contributing Guide": development/contributing.md
      - "Documentation Style": development/doc-style.md
      - "Issue Templates Guide": development/issue-usage.md
      - "Release Process": development/releases.md
  - "Examples":
      - "Architecture Diagrams": examples/architecture-examples.md
      - "Flow Charts": examples/flow-examples.md
      - "Gantt Charts": examples/gantt-examples.md
      - "Sequence Diagrams": examples/sequence-examples.md
  - "Observability":
      - "Metrics & SLOs": observability/metrics.md
  - "Compliance":
      - "Documentation Policy": compliance/documentation-policy.md
      - "Evidence Model": compliance/evidence-model.md
  - Contributing:
      - Git Workflow: contributing/git-workflow.md
      - Commit Signing: contributing/commit-signing.md
      - Docs Style Guide: contributing/docs-style.md
  - Release Notes:
      - Changelog: changelog/release-notes.md
      - Release History: changelog/releases.md
  - Support:
      - FAQ: support/faq.md
      - Contact: support/contact.md
      - Troubleshooting: support/troubleshooting.md

extra:
  generator: false
  github:
    repository: DevilsDev/SCIRM_Monorepo
    default_branch: main
    deploy_branch: firebase-hosting

copyright: "© SCIRM | Last Updated: {{ macros_info.build_date }} | Commit: {{ macros_info.git_short_commit }}"
