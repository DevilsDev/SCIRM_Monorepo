site_name: SCIRM Documentation
site_url: https://scirm-dd5c3.web.app
site_description: Supply Chain Intelligence & Risk Management Platform Documentation
use_directory_urls: true

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.action.view

plugins:
  - search:
      lang: en
  - sitemap:
      change_frequency: weekly
      priority: 0.8

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Introduction:
    - Overview: intro/overview.md
    - Getting Started: intro/getting-started.md
  - Product:
    - Product Requirements (PRD): product/prd.md
    - Product Design (PDD): product/pdd.md
    - Anti-Patterns & Governance: product/anti-patterns.md
  - Architecture:
    - System Overview: architecture/system-overview.md
    - Multi-Agent Architecture: architecture/agents.md
    - Architecture Decision Records: adr/
  - Security: security/
  - Development:
    - Roadmap: roadmap/
    - Changelog: changelog/
  - Support: support/

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://scirm-dd5c3.web.app
  generator: false

copyright: Copyright &copy; 2025 SCIRM Project
