# One-off job, run by deploy.yml before each rollout: applies migrations as the
# database owner and (re)configures the restricted scirm_app role the services use.
# Any service image works; deploy.yml pins the coordinator image of the build.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: scirm-staging
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # the image user is named, and runAsNonRoot needs a numeric id
      containers:
      - name: db-migrate
        image: ghcr.io/devilsdev/scirm_monorepo/coordinator:latest
        command: ["python", "scripts/db_setup.py", "--app-role", "scirm_app"]
        env:
        - name: DATABASE_OWNER_URL
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: database-owner-url
        - name: DATABASE_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: database-app-password
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 256Mi }
