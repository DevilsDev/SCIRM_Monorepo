# Complete Kubernetes deployment for all SCIRM services in staging

# Planner Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner
  namespace: scirm-staging
  labels:
    app: planner
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: planner
  template:
    metadata:
      labels:
        app: planner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: scirm-service-account
      containers:
      - name: planner
        image: scirm/planner:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: redis-url
        - name: WEAVIATE_URL
          value: "http://weaviate:8080"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: openai-api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: planner
  namespace: scirm-staging
spec:
  selector:
    app: planner
  ports:
  - port: 8000
    targetPort: 8000
---
