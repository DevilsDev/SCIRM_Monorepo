# API Gateway Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: scirm-staging
  labels:
    app: api-gateway
    environment: staging
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: scirm-service-account
      containers:
      - name: api-gateway
        image: ghcr.io/devilsdev/scirm_monorepo/api-gateway:latest  # deploy.yml pins the release tag
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: redis-url
        - name: STORE_BACKEND
          value: "postgres"
        # Names must match what libs/common/auth.py and the gateway read.
        - name: ENVIRONMENT
          value: "staging"
        # Base URL for invitation links (scripts/create_tenant.py, Settings > Team).
        - name: PUBLIC_APP_URL
          value: "REPLACE_WITH_STAGING_APP_URL"
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: jwt-secret
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: service-api-key
        - name: COORDINATOR_SERVICE_URL
          value: "http://coordinator:8000"
        - name: PLANNER_SERVICE_URL
          value: "http://planner:8000"
        - name: RESEARCHER_SERVICE_URL
          value: "http://researcher:8000"
        - name: EXECUTOR_SERVICE_URL
          value: "http://executor:8000"
        - name: REVIEWER_SERVICE_URL
          value: "http://reviewer:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: scirm-staging
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer
---
# Frontend Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: scirm-staging
  labels:
    app: frontend
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/devilsdev/scirm_monorepo/frontend:latest  # deploy.yml pins the release tag
        ports:
        # Static bundle served by unprivileged nginx. API URLs are build-time
        # (VITE_API_URL / VITE_WS_URL build args), not runtime env.
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: scirm-staging
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 8080
  type: LoadBalancer
