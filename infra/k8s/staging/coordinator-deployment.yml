apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: scirm-staging
  labels:
    app: coordinator
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: scirm-service-account
      containers:
      - name: coordinator
        image: ghcr.io/devilsdev/scirm_monorepo/coordinator:latest  # deploy.yml pins the release tag
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: redis-url
        - name: STORE_BACKEND
          value: "postgres"
        - name: WEAVIATE_URL
          value: "http://weaviate:8080"
        - name: LOG_LEVEL
          value: "INFO"
        - name: ENVIRONMENT
          value: "staging"
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: service-api-key
        # Decrypts tenants' SAP connection passwords (same key as the gateway's MFA seeds).
        - name: MFA_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: mfa-encryption-key
        # Scheduled report emails (optional: without smtp-host nothing is sent and the UI says so).
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: smtp-host
              optional: true
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: smtp-port
              optional: true
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: smtp-username
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: smtp-password
              optional: true
        - name: SMTP_FROM
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: smtp-from
              optional: true
        # Links back to SCIRM in report emails.
        - name: PUBLIC_APP_URL
          value: "REPLACE_WITH_STAGING_APP_URL"
        - name: PLANNER_SERVICE_URL
          value: "http://planner:8000"
        - name: RESEARCHER_SERVICE_URL
          value: "http://researcher:8000"
        - name: EXECUTOR_SERVICE_URL
          value: "http://executor:8000"
        - name: REVIEWER_SERVICE_URL
          value: "http://reviewer:8000"
        - name: DISCOVERY_SERVICE_URL
          value: "http://discovery:8000"
        - name: INGESTION_SERVICE_URL
          value: "http://ingestion:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: scirm-staging
  labels:
    app: coordinator
spec:
  selector:
    app: coordinator
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
