---
# ingestion
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: scirm-staging
  labels:
    app: ingestion
    environment: staging
spec:
  replicas: 1  # One replica: it runs the scheduled ingestion loop.
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: scirm-bedrock
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ingestion
        image: ghcr.io/devilsdev/scirm_monorepo/ingestion:latest  # deploy.yml pins the release tag
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "staging"
        - name: LOG_LEVEL
          value: "INFO"
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: service-api-key
        - name: STORE_BACKEND
          value: "postgres"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: database-url
        - name: INGESTION_AUTO
          value: "true"
        - name: INGESTION_INTERVAL_MINUTES
          value: "60"
        - name: LLM_PROVIDER
          value: "bedrock"
        - name: LLM_EU_ONLY
          value: "true"
        - name: BEDROCK_REGION
          value: "eu-central-1"
        - name: BEDROCK_MODEL_ID
          value: "eu.anthropic.claude-sonnet-5-5"
        - name: EMBEDDINGS_PROVIDER
          value: "bedrock"
        - name: EMBED_MODEL_ID
          value: "eu.cohere.embed-v4:0"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: scirm-staging
spec:
  selector:
    app: ingestion
  ports:
  - port: 8000
    targetPort: 8000
