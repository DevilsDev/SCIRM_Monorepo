# Staging manifests for the agent services that had none. Generated from one
# definition so they stay consistent: non-root (uid 10001, the image user), read-only
# root filesystem, no privilege escalation, all capabilities dropped, and the
# service-to-service key (ENVIRONMENT=staging makes services require it).
#
# ingestion and discovery call Amazon Bedrock (EU) and use the scirm-bedrock service
# account, which carries the IAM role (service-accounts.yml). No AWS keys are stored.
# risk-scorer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-scorer
  namespace: scirm-staging
  labels:
    app: risk-scorer
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-scorer
  template:
    metadata:
      labels:
        app: risk-scorer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: scirm-service-account
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: risk-scorer
        image: ghcr.io/devilsdev/scirm_monorepo/risk-scorer:latest  # deploy.yml pins the release tag
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "staging"
        - name: LOG_LEVEL
          value: "INFO"
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: scirm-secrets
              key: service-api-key
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: risk-scorer
  namespace: scirm-staging
spec:
  selector:
    app: risk-scorer
  ports:
  - port: 8000
    targetPort: 8000
---
