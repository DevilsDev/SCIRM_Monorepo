apiVersion: v1
kind: Secret
metadata:
  name: scirm-secrets
  namespace: scirm-staging
type: Opaque
stringData:
  # Database
  database-url: "postgresql://scirm:REPLACE_WITH_ACTUAL_PASSWORD@postgres:5432/scirm_staging"
  
  # Redis
  redis-url: "redis://redis:6379"
  
  # AI Service API Keys
  openai-api-key: "REPLACE_WITH_ACTUAL_OPENAI_KEY"
  anthropic-api-key: "REPLACE_WITH_ACTUAL_ANTHROPIC_KEY"
  
  # Vector Database
  weaviate-api-key: "REPLACE_WITH_ACTUAL_WEAVIATE_KEY"
  pinecone-api-key: "REPLACE_WITH_ACTUAL_PINECONE_KEY"
  
  # External Data Sources
  weather-api-key: "REPLACE_WITH_ACTUAL_WEATHER_KEY"
  logistics-api-key: "REPLACE_WITH_ACTUAL_LOGISTICS_KEY"
  financial-api-key: "REPLACE_WITH_ACTUAL_FINANCIAL_KEY"
  
  # JWT and Security
  jwt-secret: "REPLACE_WITH_ACTUAL_JWT_SECRET"
  encryption-key: "REPLACE_WITH_ACTUAL_ENCRYPTION_KEY"
  
  # Monitoring
  grafana-admin-password: "REPLACE_WITH_ACTUAL_GRAFANA_PASSWORD"
  
  # Slack Integration
  slack-webhook-url: "REPLACE_WITH_ACTUAL_SLACK_WEBHOOK"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scirm-config
  namespace: scirm-staging
data:
  # Application Configuration
  log-level: "INFO"
  environment: "staging"
  
  # Performance Settings
  max-concurrent-tasks: "50"
  request-timeout: "30"
  
  # AI Model Configuration
  default-model: "gpt-4"
  temperature: "0.1"
  max-tokens: "2000"
  
  # Vector Database Settings
  vector-dimensions: "1536"
  similarity-threshold: "0.8"
  
  # Compliance Settings
  audit-enabled: "true"
  data-retention-days: "90"
