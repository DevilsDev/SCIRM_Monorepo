# Service accounts for staging. Every deployment referenced scirm-service-account,
# but nothing created it, so pods could not be scheduled.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scirm-service-account
  namespace: scirm-staging
automountServiceAccountToken: false
---
# For the services that call Amazon Bedrock in the EU (ingestion, discovery). Bind it to
# an IAM role allowing bedrock:InvokeModel / bedrock:Converse on the eu. inference
# profiles (docs/bedrock-setup.md): with IRSA, set the annotation; with EKS Pod Identity,
# create the association instead and leave it unset.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scirm-bedrock
  namespace: scirm-staging
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_BEDROCK_ROLE_ARN"
