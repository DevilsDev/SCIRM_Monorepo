name: "🚫 Block Main Branch Deployments"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  no-deploy-from-main:
    name: "Ensure Main Never Deploys"
    runs-on: ubuntu-latest
    
    steps:
    - name: Assert no deploy jobs on main
      run: |
        echo "🔍 Validating main branch deployment restrictions..."
        echo "Branch: ${{ github.ref_name }}"
        echo "Event: ${{ github.event_name }}"
        
        echo ""
        echo "✅ **MAIN BRANCH POLICY ENFORCED**"
        echo "📋 Main branch is source of truth only:"
        echo "   • PRs and reviews ✅"
        echo "   • CI checks (docs-build, lint, tests, security-scans, codeql) ✅"
        echo "   • Code quality gates ✅"
        echo "   • Deployments ❌ BLOCKED"
        echo ""
        echo "🚀 **Deployment Process:**"
        echo "   1. Changes merged to main (this branch)"
        echo "   2. Create PR: main → firebase-hosting"
        echo "   3. Merge to firebase-hosting → triggers deployment"
        echo ""
        echo "🔒 **Security Rationale:**"
        echo "   • Separates content authoring from deployment"
        echo "   • Ensures all deployments are intentional"
        echo "   • Maintains audit trail of deployment decisions"
        echo "   • Prevents accidental deployments from main"
        echo ""
        echo "This guard confirms main branch deployment discipline is maintained"
