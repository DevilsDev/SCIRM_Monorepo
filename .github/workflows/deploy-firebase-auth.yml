name: Deploy - Firebase Auth-Gated Site (DEPRECATED)

# DEPRECATED: This workflow is disabled in favor of deploy-firebase-from-fh.yml
# Only firebase-hosting branch deployments are now allowed for security compliance
on:
  workflow_dispatch:
    inputs:
      force_enable:
        description: 'Force enable (emergency only)'
        required: true
        default: 'false'
        type: choice
        options:
        - 'false'
        - 'true'

concurrency:
  group: deploy-firebase-auth-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deprecation-notice:
    name: Workflow Deprecated
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.force_enable != 'true' }}
    
    steps:
    - name: Block deprecated workflow
      run: |
        echo "🚫 WORKFLOW DEPRECATED"
        echo "This workflow has been replaced by deploy-firebase-from-fh.yml"
        echo "Only firebase-hosting branch deployments are allowed for security compliance"
        echo ""
        echo "To deploy documentation:"
        echo "1. Push changes to firebase-hosting branch"
        echo "2. Deployment will trigger automatically from deploy-firebase-from-fh.yml"
        exit 1

  emergency-deploy:
    name: Emergency Deploy (Force Enabled)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.force_enable == 'true' }}
    
    steps:
    - name: Emergency deployment warning
      run: |
        echo "⚠️ EMERGENCY DEPLOYMENT ENABLED"
        echo "This should only be used in critical situations"
        echo "Regular deployments should use deploy-firebase-from-fh.yml"
        echo "Emergency deployment functionality would go here if needed"
