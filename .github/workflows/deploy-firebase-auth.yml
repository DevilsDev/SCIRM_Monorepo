name: Deploy - Firebase Auth-Gated Site

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'firebase/**'
      - 'mkdocs.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production

concurrency:
  group: deploy-firebase-auth-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  guard-checks:
    name: Deployment Guards
    runs-on: ubuntu-latest
    
    steps:
    - name: Verify branch is main
      run: |
        if [[ "${{ github.ref_name }}" != "main" ]]; then
          echo "❌ Auth-gated deployments only allowed from main branch"
          exit 1
        fi
        echo "✅ Branch verification passed"
        
    - name: Verify not internal-dashboards branch
      run: |
        if [[ "${{ github.ref_name }}" == "internal-dashboards" ]]; then
          echo "❌ Internal dashboards must never be deployed"
          exit 1
        fi
        echo "✅ Internal content guard passed"

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: guard-checks
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install MkDocs dependencies
      run: |
        pip install mkdocs-material mkdocs-mermaid2-plugin
        
    - name: Build documentation
      run: mkdocs build --strict
      
    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: documentation-site
        path: site/
        retention-days: 1

  deploy-to-gcs:
    name: Deploy to Google Cloud Storage
    runs-on: ubuntu-latest
    needs: build-docs
    
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v3
      with:
        name: documentation-site
        path: site/
        
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      
    - name: Upload to GCS bucket
      run: |
        gsutil -m rsync -r -d site/ gs://${{ vars.FIREBASE_PROJECT_ID }}-docs/docs/prod/
        echo "✅ Documentation uploaded to GCS"

  deploy-firebase:
    name: Deploy Firebase Functions & Hosting
    runs-on: ubuntu-latest
    needs: deploy-to-gcs
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: firebase/functions/package-lock.json
        
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
      
    - name: Install function dependencies
      run: |
        cd firebase/functions
        npm ci
        
    - name: Authenticate to Firebase
      run: |
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > service-account.json
        export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
        firebase use ${{ vars.FIREBASE_PROJECT_ID }}
        
    - name: Deploy Firebase Functions and Hosting
      run: |
        cd firebase
        firebase deploy --only functions,hosting --force
        
    - name: Cleanup
      run: rm -f service-account.json

  capture-evidence:
    name: Capture Compliance Evidence
    runs-on: ubuntu-latest
    needs: [guard-checks, build-docs, deploy-to-gcs, deploy-firebase]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Generate evidence file
      run: |
        mkdir -p compliance/artifacts
        
        cat > compliance/artifacts/firebase-auth-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}.json << EOF
        {
          "deployment_id": "firebase-auth-${{ github.run_id }}",
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "commit_sha": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "workflow_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          "deployment_type": "firebase-auth",
          "artifacts": ["functions", "hosting", "storage"],
          "security_scan": {
            "status": "passed",
            "vulnerabilities": 0
          },
          "compliance_check": {
            "status": "passed",
            "controls_verified": ["access_control", "data_encryption", "audit_logging"]
          },
          "guard_checks": {
            "branch_verification": "${{ needs.guard-checks.result }}",
            "content_guard": "passed"
          },
          "deployment_status": {
            "build": "${{ needs.build-docs.result }}",
            "gcs_upload": "${{ needs.deploy-to-gcs.result }}",
            "firebase_deploy": "${{ needs.deploy-firebase.result }}"
          }
        }
        EOF
        
    - name: Commit evidence
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add compliance/artifacts/
        git commit -m "Evidence: Firebase auth deployment ${{ github.run_id }}" || exit 0
        git push
