name: CI

on:
  # All pull requests, including stacked PRs whose base is another feature branch.
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the python:3.11-slim base of the service images.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Compile all Python sources
        run: python -m compileall -q libs services apps/api-gateway alembic

      - name: Security, AI-trust and public-intelligence tests
        run: pytest tests/security tests/ai_trust tests/intel tests/evidence tests/erp tests/scenarios -q

  postgres:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Superuser for provisioning only; the tests query as a restricted app role.
      TEST_POSTGRES_URL: postgresql://postgres:ci-superuser@localhost:5432/postgres
      STORE_BACKEND: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Security suite on the Postgres store, RLS/audit/migration checks, and the Evidence Engine quality gate
        run: pytest tests/security tests/db tests/evidence -q

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Build image (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: api-gateway, path: apps/api-gateway }
          - { name: coordinator, path: services/coordinator }
          - { name: planner, path: services/planner }
          - { name: researcher, path: services/researcher, extra_pip: "weaviate-client==3.26.7" }
          - { name: executor, path: services/executor }
          - { name: reviewer, path: services/reviewer }
          - { name: risk-scorer, path: services/risk-scorer }
          - { name: discovery, path: services/discovery }
          - { name: ingestion, path: services/ingestion }
          - { name: chat, path: services/chat }
          - { name: simulator, path: services/simulator }
          - { name: procurement, path: services/procurement }
          - { name: component-tracker, path: services/component-tracker }
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >
          docker build -f docker/service.Dockerfile
          --build-arg SERVICE_PATH=${{ matrix.service.path }}
          --build-arg "EXTRA_PIP=${{ matrix.service.extra_pip }}"
          -t scirm/${{ matrix.service.name }}:ci .
      - name: Start the container hardened as in Kubernetes and check it serves /ready as a non-root user
        # Same constraints as the staging manifests: read-only root filesystem with a
        # writable /tmp, all capabilities dropped, no privilege escalation.
        run: |
          docker run -d --name svc -e ENVIRONMENT=test -p 8000:8000             --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges             scirm/${{ matrix.service.name }}:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ready && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ready || { docker logs svc; exit 1; }
          test "$(docker exec svc id -u)" = "10001"

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate against the Kubernetes schemas
        # secrets.example.yml is a template with placeholders; it is still schema-valid.
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 infra/k8s/staging/*.yml

  frontend-image:
    name: Build image (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t scirm/frontend:ci apps/frontend
      - name: Serve index.html and fall back for client-side routes
        run: |
          docker run -d --name web -p 8080:8080 scirm/frontend:ci
          sleep 2
          curl -fsS http://127.0.0.1:8080/ | grep -qi "<div id=\"root\""
          curl -fsS http://127.0.0.1:8080/risks/123 | grep -qi "<div id=\"root\""
