name: "🚀 Deploy Firebase - Secure Documentation"

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "firebase/**"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deployment (bypass checks)"
        required: false
        type: boolean
        default: false

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'scirm-docs-prod' }}
  GCS_BUCKET: ${{ vars.FIREBASE_PROJECT_ID || 'scirm-docs-prod' }}.appspot.com

jobs:
  # ============================================================================
  # DEPLOYMENT GUARD - Ensure we're on main branch
  # ============================================================================
  deployment-guard:
    name: "🛡️ Deployment Guard"
    runs-on: ubuntu-latest
    steps:
      - name: Verify main branch deployment
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "❌ DEPLOYMENT BLOCKED: Firebase deploys only allowed from main branch"
            echo "Current branch: ${{ github.ref }}"
            echo "Required branch: refs/heads/main"
            exit 1
          fi
          echo "✅ Deployment guard passed - deploying from main branch"

  # ============================================================================
  # BUILD DOCUMENTATION
  # ============================================================================
  build-docs:
    name: "📖 Build Documentation"
    runs-on: ubuntu-latest
    needs: deployment-guard
    outputs:
      build-hash: ${{ steps.build-info.outputs.hash }}
      build-timestamp: ${{ steps.build-info.outputs.timestamp }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install MkDocs dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mkdocs-mermaid2-plugin mkdocs-git-revision-date-localized-plugin
          pip install mkdocs-awesome-pages-plugin mkdocs-redirects mkdocs-minify-plugin

      - name: Build documentation
        run: |
          echo "🏗️ Building production documentation..."
          mkdocs build --strict --clean
          
          # Inject build metadata
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_HASH="${{ github.sha }}"
          
          # Add build info to index.html
          sed -i "s|</head>|<meta name=\"build-time\" content=\"$BUILD_TIME\"><meta name=\"build-hash\" content=\"$BUILD_HASH\"></head>|" site/index.html
          
          echo "✅ Documentation built successfully"

      - name: Set build info outputs
        id: build-info
        run: |
          echo "hash=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Upload documentation build
        uses: actions/upload-artifact@v4
        with:
          name: docs-production-${{ github.sha }}
          path: site/
          retention-days: 90

  # ============================================================================
  # DEPLOY TO CLOUD STORAGE
  # ============================================================================
  deploy-storage:
    name: "☁️ Deploy to Cloud Storage"
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Download documentation build
        uses: actions/download-artifact@v4
        with:
          name: docs-production-${{ github.sha }}
          path: site/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to Cloud Storage
        run: |
          echo "☁️ Uploading documentation to Cloud Storage..."
          
          # Upload to production path
          gsutil -m rsync -r -d site/ gs://${{ env.GCS_BUCKET }}/docs/prod/
          
          # Set cache headers
          gsutil -m setmeta -h "Cache-Control:public, max-age=300" gs://${{ env.GCS_BUCKET }}/docs/prod/**
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000" gs://${{ env.GCS_BUCKET }}/docs/prod/assets/**
          
          # Create versioned backup
          VERSION_PATH="docs/releases/v$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"
          gsutil -m cp -r gs://${{ env.GCS_BUCKET }}/docs/prod/* gs://${{ env.GCS_BUCKET }}/$VERSION_PATH/
          
          echo "✅ Documentation uploaded to Cloud Storage"
          echo "📍 Production: gs://${{ env.GCS_BUCKET }}/docs/prod/"
          echo "📍 Backup: gs://${{ env.GCS_BUCKET }}/$VERSION_PATH/"

  # ============================================================================
  # DEPLOY FIREBASE FUNCTIONS & HOSTING
  # ============================================================================
  deploy-firebase:
    name: "🔥 Deploy Firebase"
    runs-on: ubuntu-latest
    needs: [build-docs, deploy-storage]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        run: |
          cd firebase/functions
          npm ci

      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > /tmp/service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json
          firebase use ${{ env.FIREBASE_PROJECT_ID }}

      - name: Deploy Firebase Functions
        run: |
          cd firebase
          echo "🔥 Deploying Cloud Functions..."
          firebase deploy --only functions --project ${{ env.FIREBASE_PROJECT_ID }}

      - name: Deploy Firebase Hosting
        run: |
          cd firebase
          echo "🔥 Deploying Firebase Hosting..."
          firebase deploy --only hosting --project ${{ env.FIREBASE_PROJECT_ID }}

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/service-account.json

  # ============================================================================
  # POST-DEPLOYMENT VALIDATION
  # ============================================================================
  validate-deployment:
    name: "✅ Validate Deployment"
    runs-on: ubuntu-latest
    needs: deploy-firebase
    steps:
      - name: Health check
        run: |
          echo "🏥 Running deployment health checks..."
          
          # Check if site is accessible (should redirect to login)
          SITE_URL="https://${{ env.FIREBASE_PROJECT_ID }}.web.app"
          
          response=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || echo "000")
          
          if [ "$response" = "200" ] || [ "$response" = "302" ]; then
            echo "✅ Site is accessible: $SITE_URL (HTTP $response)"
          else
            echo "❌ Site health check failed: HTTP $response"
            exit 1
          fi
          
          echo "✅ Deployment validation completed"

  # ============================================================================
  # EVIDENCE CAPTURE & COMPLIANCE
  # ============================================================================
  capture-evidence:
    name: "📋 Capture Evidence"
    runs-on: ubuntu-latest
    needs: [build-docs, deploy-storage, deploy-firebase, validate-deployment]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create compliance evidence
        run: |
          echo "📋 Generating deployment evidence..."
          
          # Create evidence directory
          EVIDENCE_DIR="compliance/artifacts/$(date +%Y-%m-%d-%H%M)"
          mkdir -p "$EVIDENCE_DIR"
          
          # Generate deployment evidence JSON
          cat > "$EVIDENCE_DIR/firebase-deploy.json" << EOF
          {
            "deployment_id": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit_sha": "${{ github.sha }}",
            "commit_message": $(echo '${{ github.event.head_commit.message }}' | jq -R .),
            "deployer": "${{ github.actor }}",
            "branch": "${{ github.ref_name }}",
            "build_hash": "${{ needs.build-docs.outputs.build-hash }}",
            "build_timestamp": "${{ needs.build-docs.outputs.build-timestamp }}",
            "firebase_project": "${{ env.FIREBASE_PROJECT_ID }}",
            "deployment_url": "https://${{ env.FIREBASE_PROJECT_ID }}.web.app",
            "storage_bucket": "${{ env.GCS_BUCKET }}",
            "job_results": {
              "build_docs": "${{ needs.build-docs.result }}",
              "deploy_storage": "${{ needs.deploy-storage.result }}",
              "deploy_firebase": "${{ needs.deploy-firebase.result }}",
              "validate_deployment": "${{ needs.validate-deployment.result }}"
            },
            "security_controls": {
              "auth_required": true,
              "session_cookies": true,
              "security_headers": true,
              "storage_rules": true
            },
            "compliance_status": "DEPLOYED",
            "evidence_captured_by": "github-actions",
            "workflow": "deploy-firebase.yml"
          }
          EOF
          
          echo "✅ Evidence captured: $EVIDENCE_DIR/firebase-deploy.json"

      - name: Commit evidence
        run: |
          git config --local user.email "compliance-bot@scirm.ai"
          git config --local user.name "SCIRM Compliance Bot"
          
          git add compliance/artifacts/
          
          if git diff --staged --quiet; then
            echo "📋 No new evidence to commit"
          else
            git commit -m "📋 Firebase deployment evidence: ${{ github.sha }}
            
            Deployment Details:
            - Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
            - Commit: ${{ github.sha }}
            - Deployer: ${{ github.actor }}
            - Project: ${{ env.FIREBASE_PROJECT_ID }}
            - URL: https://${{ env.FIREBASE_PROJECT_ID }}.web.app
            
            Security Controls:
            ✅ Authentication required
            ✅ Session cookie validation
            ✅ Security headers enforced
            ✅ Storage access rules
            
            Evidence: compliance/artifacts/$(date +%Y-%m-%d-%H%M)/firebase-deploy.json"
            
            git push origin main
            echo "✅ Evidence committed to repository"
          fi

  # ============================================================================
  # DEPLOYMENT SUMMARY
  # ============================================================================
  deployment-summary:
    name: "📊 Deployment Summary"
    runs-on: ubuntu-latest
    needs: [build-docs, deploy-storage, deploy-firebase, validate-deployment, capture-evidence]
    if: always()
    steps:
      - name: Generate deployment summary
        run: |
          echo "🚀 Firebase Deployment Summary"
          echo "=============================="
          echo ""
          echo "📍 **Deployment Details:**"
          echo "   • Project: ${{ env.FIREBASE_PROJECT_ID }}"
          echo "   • URL: https://${{ env.FIREBASE_PROJECT_ID }}.web.app"
          echo "   • Commit: ${{ github.sha }}"
          echo "   • Branch: ${{ github.ref_name }}"
          echo "   • Deployer: ${{ github.actor }}"
          echo "   • Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo ""
          echo "🏗️ **Build Status:**"
          echo "   • Documentation Build: ${{ needs.build-docs.result }}"
          echo "   • Cloud Storage Deploy: ${{ needs.deploy-storage.result }}"
          echo "   • Firebase Deploy: ${{ needs.deploy-firebase.result }}"
          echo "   • Deployment Validation: ${{ needs.validate-deployment.result }}"
          echo "   • Evidence Capture: ${{ needs.capture-evidence.result }}"
          echo ""
          echo "🔒 **Security Controls:**"
          echo "   ✅ Authentication required (Google OAuth)"
          echo "   ✅ Session cookie validation"
          echo "   ✅ Security headers enforced"
          echo "   ✅ Cloud Storage access rules"
          echo "   ✅ No anonymous access"
          echo ""
          
          # Determine overall status
          if [[ "${{ needs.build-docs.result }}" == "success" && 
                "${{ needs.deploy-storage.result }}" == "success" && 
                "${{ needs.deploy-firebase.result }}" == "success" && 
                "${{ needs.validate-deployment.result }}" == "success" ]]; then
            echo "🎉 **DEPLOYMENT SUCCESSFUL**"
            echo "Documentation is now live and secure!"
          else
            echo "❌ **DEPLOYMENT FAILED**"
            echo "Please check the job logs for details."
          fi
