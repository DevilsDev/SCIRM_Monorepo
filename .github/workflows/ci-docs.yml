name: "🚦 CI - Documentation & Quality Gates"

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/ci-docs.yml'
      - 'apps/**'
      - 'services/**'
      - 'libs/**'
      - '*.py'
      - '*.js'
      - '*.ts'
      - 'requirements*.txt'
      - 'package*.json'
  push:
    branches: [ main ]

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  docs-build:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        pip install mkdocs-material mkdocs-mermaid2-plugin
        
    - name: Validate MkDocs configuration
      run: mkdocs config
      
    - name: Build documentation (strict mode)
      run: mkdocs build --strict
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: documentation-site
        path: site/
        retention-days: 7

  lint:
    name: Lint Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install markdownlint
      run: npm install -g markdownlint-cli
      
    - name: Lint Markdown files
      run: markdownlint docs/**/*.md --ignore docs/dashboards/

  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install mkdocs-material mkdocs-mermaid2-plugin
        
    - name: Build documentation
      run: mkdocs build
      
    - name: Check internal links
      uses: lycheeverse/lychee-action@v1
      with:
        args: --verbose --no-progress 'site/**/*.html'
        fail: true

  tests:
    name: "Run Tests"
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Run unit tests
      run: |
        python -m pytest tests/ --cov=. --cov-report=xml
        
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: always()

  security-scans:
    name: "Security Scans"
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  content-guard:
    name: Content Guard (Prevent Internal Leaks)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check for internal dashboard content
      run: |
        if find docs/ -name "*.md" -path "*/dashboards/*" | grep -q .; then
          echo "❌ Internal dashboard content found in docs/ directory"
          echo "Internal dashboards must only exist in internal-dashboards branch"
          exit 1
        fi
        echo "✅ No internal dashboard content found in public docs"
        
    - name: Check for sensitive information
      run: |
        # Check for potential secrets or sensitive data
        if grep -r -i "password\|secret\|key\|token" docs/ --include="*.md" | grep -v "example\|placeholder\|TODO"; then
          echo "❌ Potential sensitive information found"
          exit 1
        fi
        echo "✅ No sensitive information detected"

  docs-quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [docs-build, lint, link-check, tests, security-scans, content-guard]
    if: always()
    
    steps:
    - name: Check all jobs status
      run: |
        if [[ "${{ needs.docs-build.result }}" != "success" ]]; then
          echo "❌ Documentation build failed"
          exit 1
        fi
        if [[ "${{ needs.lint.result }}" != "success" ]]; then
          echo "❌ Linting failed"
          exit 1
        fi
        if [[ "${{ needs.link-check.result }}" != "success" ]]; then
          echo "❌ Link check failed"
          exit 1
        fi
        if [[ "${{ needs.security-scans.result }}" != "success" ]]; then
          echo "❌ Security scan failed"
          exit 1
        fi
        if [[ "${{ needs.content-guard.result }}" != "success" ]]; then
          echo "❌ Content guard failed"
          exit 1
        fi
        if [[ "${{ needs.tests.result }}" != "success" ]]; then
          echo "❌ Tests failed"
          exit 1
        fi
        echo "✅ All quality gates passed"
