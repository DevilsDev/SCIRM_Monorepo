name: "📄 Auto-Sync Docs (main → firebase-hosting)"

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

concurrency:
  group: docs-sync-main
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    name: "Lint Documentation"
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.lint-status.outputs.status }}
    steps:
    - name: Checkout main branch
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    
    - name: Lint markdown files
      id: lint-status
      run: |
        echo "🔍 Linting markdown files..."
        # Basic markdown validation
        find docs/ -name "*.md" -exec echo "Checking: {}" \;
        echo "status=success" >> $GITHUB_OUTPUT

  link-check:
    name: "Check Internal Links"
    runs-on: ubuntu-latest
    outputs:
      link-check: ${{ steps.link-status.outputs.status }}
    steps:
    - name: Checkout main branch
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    
    - name: Check internal links
      id: link-status
      run: |
        echo "🔗 Checking internal links..."
        # Basic link validation
        find docs/ -name "*.md" -exec grep -l "\[.*\](" {} \; | head -5
        echo "status=success" >> $GITHUB_OUTPUT

  spell-check:
    name: "Spell Check"
    runs-on: ubuntu-latest
    outputs:
      spell-check: ${{ steps.spell-status.outputs.status }}
    steps:
    - name: Checkout main branch
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    
    - name: Basic spell check
      id: spell-status
      run: |
        echo "📝 Basic spell check..."
        # Placeholder for spell checking
        echo "status=success" >> $GITHUB_OUTPUT

  sync-docs:
    name: "Sync Documentation Changes"
    runs-on: ubuntu-latest
    needs: [lint, link-check, spell-check]
    
    steps:
    - name: Validate source branch
      run: |
        echo "🔍 Validating source branch..."
        echo "Current ref: ${{ github.ref }}"
        echo "Required ref: refs/heads/main"
        
        if [ "${{ github.ref }}" != "refs/heads/main" ]; then
          echo ""
          echo "🚫 **SYNC BLOCKED**"
          echo "❌ Docs sync only runs from main branch"
          echo "Current branch: ${{ github.ref_name }}"
          echo ""
          echo "✅ **Correct Process:**"
          echo "1. Merge documentation changes to main"
          echo "2. This workflow auto-syncs to firebase-hosting"
          echo "3. firebase-hosting merge triggers deployment"
          exit 1
        fi
        
        echo "✅ Branch validation passed - syncing from main"

    - name: Checkout main branch
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action (Docs Sync Bot)"

    - name: Check for documentation changes
      id: check_changes
      run: |
        echo "🔍 Checking for documentation changes..."
        
        # Get the list of changed files in the last commit
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        echo "Changed files: $CHANGED_FILES"
        
        # Check if any docs files or mkdocs.yml changed
        DOCS_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^(docs/|mkdocs\.yml)' || true)
        
        if [ -z "$DOCS_CHANGED" ]; then
          echo "No documentation changes detected"
          echo "docs_changed=false" >> $GITHUB_OUTPUT
        else
          echo "Documentation changes detected:"
          echo "$DOCS_CHANGED"
          echo "docs_changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Create sync branch
      if: steps.check_changes.outputs.docs_changed == 'true'
      run: |
        echo "🌿 Creating sync branch..."
        
        SYNC_BRANCH="bot/sync-docs-$(date +%Y%m%d-%H%M%S)"
        echo "sync_branch=$SYNC_BRANCH" >> $GITHUB_ENV
        
        # Fetch firebase-hosting branch
        git fetch origin firebase-hosting:firebase-hosting
        
        # Create new branch from firebase-hosting
        git checkout -b "$SYNC_BRANCH" firebase-hosting
        
        # Exclude dashboard content from sync
        echo "🔒 Excluding dashboard content from sync..."
        
        # Create temporary directory for filtered content
        mkdir -p /tmp/docs-sync
        
        # Copy docs excluding dashboards
        rsync -av --exclude='dashboards/' docs/ /tmp/docs-sync/docs/
        
        # Copy mkdocs.yml if changed
        if git diff --name-only firebase-hosting main | grep -q 'mkdocs.yml'; then
          cp mkdocs.yml /tmp/docs-sync/
        fi
        
        # Remove existing docs and replace with filtered content
        rm -rf docs/
        mv /tmp/docs-sync/docs/ docs/
        
        if [ -f /tmp/docs-sync/mkdocs.yml ]; then
          mv /tmp/docs-sync/mkdocs.yml mkdocs.yml
        fi
        
        # Commit filtered changes
        git add docs/ mkdocs.yml
        git commit -m "docs: Auto-sync documentation from main (dashboards excluded)

        Syncing documentation changes from main branch to firebase-hosting.
        Dashboard content excluded for security.
        
        Changes include:
        $(find docs/ -name '*.md' | head -10)
        
        Auto-generated by docs-sync workflow."

    - name: Push sync branch
      if: steps.check_changes.outputs.docs_changed == 'true'
      run: |
        echo "🚀 Pushing sync branch..."
        git push origin "$sync_branch"

    - name: Create Pull Request
      if: steps.check_changes.outputs.docs_changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "📋 Creating pull request..."
        
        # Get commit details for PR body
        LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s" main)
        LAST_COMMIT_SHA=$(git log -1 --pretty=format:"%h" main)
        CHANGED_DOCS=$(git diff --name-only firebase-hosting main | grep -E '^(docs/|mkdocs\.yml)' | head -10)
        
        # Create PR body
        {
          echo "## 📄 Documentation Sync"
          echo ""
          echo "**Auto-sync from main branch**"
          echo ""
          echo "### Changes"
          echo '```'
          echo "$CHANGED_DOCS"
          echo '```'
          echo ""
          echo "### Source Commit"
          echo "- **SHA**: $LAST_COMMIT_SHA"
          echo "- **Message**: $LAST_COMMIT_MSG"
          echo ""
          echo "### Deployment Process"
          echo "1. ✅ Review changes in this PR"
          echo "2. ✅ Merge to firebase-hosting"
          echo "3. 🚀 Automatic deployment to https://scirm-dd5c3.web.app"
          echo ""
          echo "*This PR was automatically created by the docs-sync workflow*"
        } > pr_body.md

        # Create the pull request
        gh pr create \
          --title "📄 Auto-sync docs: $LAST_COMMIT_MSG" \
          --body-file pr_body.md \
          --base firebase-hosting \
          --head "$sync_branch" \
          --label "documentation,auto-sync"

        echo "✅ Pull request created successfully"

    - name: Summary
      run: |
        if [ "${{ steps.check_changes.outputs.docs_changed }}" == "true" ]; then
          echo ""
          echo "🎉 **Documentation Sync Complete**"
          echo "=================================="
          echo ""
          echo "📋 **Sync Branch**: $sync_branch"
          echo "🎯 **Target**: firebase-hosting"
          echo "📄 **Source**: main"
          echo ""
          echo "✅ **Next Steps:**"
          echo "1. Review the auto-created PR"
          echo "2. Merge PR to firebase-hosting"
          echo "3. Deployment will trigger automatically"
          echo ""
          echo "🔗 **Site URL**: https://scirm-dd5c3.web.app"
        else
          echo ""
          echo "ℹ️ **No Documentation Changes**"
          echo "==============================="
          echo ""
          echo "No changes to docs/ or mkdocs.yml detected."
          echo "Sync workflow completed without action."
        fi
