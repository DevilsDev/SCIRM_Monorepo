name: Documentation

# Builds the docs (strict: broken links fail) and each service's OpenAPI spec on every
# change that can affect them. Both are attached to the run as artifacts.
#
# Publishing to GitHub Pages is off. ADR-003 calls for organisation-only (private) Pages,
# which this public repository cannot provide. Pages also needs enabling in the
# repository settings, and turning it on publishes the docs to the web. To publish
# anyway, enable Pages (source: GitHub Actions) and set the repository variable
# DOCS_PAGES_ENABLED to "true"; pushes to main then deploy.

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/export_openapi.py"
      - "apps/api-gateway/**"
      - "services/**"
      - "libs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/export_openapi.py"
      - "apps/api-gateway/**"
      - "services/**"
      - "libs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MkDocs
        run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"
      - name: Build
        run: mkdocs build --strict --site-dir site
      - name: Internal dashboards are not in the site (ADR-003)
        run: test ! -e site/dashboards
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  api-specs:
    name: OpenAPI specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Export every service's spec
        env:
          ENVIRONMENT: test
        run: python scripts/export_openapi.py api-specs
      - uses: actions/upload-artifact@v4
        with:
          name: api-specs
          path: api-specs/

  deploy-docs:
    name: Publish to GitHub Pages
    needs: build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
