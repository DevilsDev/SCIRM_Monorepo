name: Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    types: [ closed ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    strategy:
      matrix:
        service:
          - name: api-gateway
            context: .
            dockerfile: ./apps/api-gateway/Dockerfile
          - name: coordinator
            context: .
            dockerfile: ./services/coordinator/Dockerfile
          - name: planner
            context: .
            dockerfile: ./services/planner/Dockerfile
          - name: researcher
            context: .
            dockerfile: ./services/researcher/Dockerfile
          - name: executor
            context: .
            dockerfile: ./services/executor/Dockerfile
          - name: reviewer
            context: .
            dockerfile: ./services/reviewer/Dockerfile
          - name: frontend
            context: ./apps/frontend
            dockerfile: ./apps/frontend/Dockerfile
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
    
    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.service.context }}
        file: ${{ matrix.service.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      github.event.inputs.environment == 'staging' || 
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-')) ||
      github.event_name == 'repository_dispatch' && github.event.action == 'deploy-staging'
    environment: staging
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}
    
    - name: Deploy to staging
      run: |
        # Update image tags in Kubernetes manifests
        export IMAGE_TAG=${{ github.sha }}
        envsubst < infra/k8s/staging/kustomization.yaml.template > infra/k8s/staging/kustomization.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -k infra/k8s/staging/
        
        # Wait for rollout to complete
        kubectl rollout status deployment/api-gateway -n scirm-staging --timeout=300s
        kubectl rollout status deployment/coordinator -n scirm-staging --timeout=300s
        kubectl rollout status deployment/planner -n scirm-staging --timeout=300s
        kubectl rollout status deployment/researcher -n scirm-staging --timeout=300s
        kubectl rollout status deployment/executor -n scirm-staging --timeout=300s
        kubectl rollout status deployment/reviewer -n scirm-staging --timeout=300s
        kubectl rollout status deployment/frontend -n scirm-staging --timeout=300s
    
    - name: Run smoke tests
      run: |
        # Wait for services to be ready
        sleep 60
        
        # Get staging URL
        STAGING_URL=$(kubectl get ingress scirm-ingress -n scirm-staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        
        # Run smoke tests
        curl -f https://$STAGING_URL/health || exit 1
        curl -f https://$STAGING_URL/api/health || exit 1
        
        echo "Staging deployment successful: https://$STAGING_URL"

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.environment == 'production' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
    environment: production
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.PRODUCTION_KUBECONFIG }}
    
    - name: Deploy to production
      run: |
        # Update image tags in Kubernetes manifests
        export IMAGE_TAG=${{ github.sha }}
        envsubst < infra/k8s/production/kustomization.yaml.template > infra/k8s/production/kustomization.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -k infra/k8s/production/
        
        # Wait for rollout to complete
        kubectl rollout status deployment/api-gateway -n scirm-production --timeout=600s
        kubectl rollout status deployment/coordinator -n scirm-production --timeout=600s
        kubectl rollout status deployment/planner -n scirm-production --timeout=600s
        kubectl rollout status deployment/researcher -n scirm-production --timeout=600s
        kubectl rollout status deployment/executor -n scirm-production --timeout=600s
        kubectl rollout status deployment/reviewer -n scirm-production --timeout=600s
        kubectl rollout status deployment/frontend -n scirm-production --timeout=600s
    
    - name: Run production health checks
      run: |
        # Wait for services to be ready
        sleep 120
        
        # Get production URL
        PRODUCTION_URL=$(kubectl get ingress scirm-ingress -n scirm-production -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        
        # Run comprehensive health checks
        curl -f https://$PRODUCTION_URL/health || exit 1
        curl -f https://$PRODUCTION_URL/api/health || exit 1
        curl -f https://$PRODUCTION_URL/api/coordinator/health || exit 1
        curl -f https://$PRODUCTION_URL/api/planner/health || exit 1
        curl -f https://$PRODUCTION_URL/api/researcher/health || exit 1
        curl -f https://$PRODUCTION_URL/api/executor/health || exit 1
        curl -f https://$PRODUCTION_URL/api/reviewer/health || exit 1
        
        echo "Production deployment successful: https://$PRODUCTION_URL"
    
    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        files: |
          CHANGELOG.md

  notify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Notify deployment status
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          SCIRM Platform Deployment ${{ job.status }}
          Environment: ${{ github.event.inputs.environment || 'production' }}
          Version: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: always()

  security-scan-images:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    strategy:
      matrix:
        service: [api-gateway, coordinator, planner, researcher, executor, reviewer, frontend]
    
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-${{ matrix.service }}.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-${{ matrix.service }}.sarif'

  update-infrastructure:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.event.inputs.environment == 'production' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
    
    steps:
    - name: Update monitoring dashboards
      run: |
        # Update Grafana dashboards
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d @ops/monitoring/grafana-dashboard.json \
          https://grafana.scirm.io/api/dashboards/db
    
    - name: Update documentation
      run: |
        # Trigger documentation rebuild
        curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type": "docs-rebuild"}'
