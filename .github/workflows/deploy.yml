name: Deploy

# Builds and pushes every image on version tags (or manual dispatch) and deploys
# to staging. Production deployment is intentionally absent: there are no
# production manifests in this repository yet (see infra/k8s/).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Image names must be lowercase; github.repository may not be.
  IMAGE_PREFIX: ghcr.io/devilsdev/scirm_monorepo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: api-gateway, path: apps/api-gateway }
          - { name: coordinator, path: services/coordinator }
          - { name: planner, path: services/planner }
          - { name: researcher, path: services/researcher, extra_pip: "weaviate-client==3.26.7" }
          - { name: executor, path: services/executor }
          - { name: reviewer, path: services/reviewer }
          - { name: risk-scorer, path: services/risk-scorer }
          - { name: discovery, path: services/discovery }
          - { name: ingestion, path: services/ingestion }
          - { name: chat, path: services/chat }
          - { name: simulator, path: services/simulator }
          - { name: procurement, path: services/procurement }
          - { name: component-tracker, path: services/component-tracker }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/service.Dockerfile
          build-args: |
            SERVICE_PATH=${{ matrix.service.path }}
            EXTRA_PIP=${{ matrix.service.extra_pip }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  build-and-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          # Vite inlines these at build time; set the staging API URL as a repository variable.
          build-args: |
            VITE_API_URL=${{ vars.STAGING_API_URL }}
            VITE_WS_URL=${{ vars.STAGING_WS_URL }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  scan-images:
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-frontend]
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, coordinator, planner, researcher, executor, reviewer, risk-scorer,
                  discovery, ingestion, chat, simulator, procurement, component-tracker, frontend]
    steps:
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-frontend]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}
      - name: Migrate the database before anything rolls out
        # Applying manifests can itself start a rollout, so this runs first. It only
        # needs the namespace and scirm-secrets, both created out of band.
        run: |
          kubectl -n scirm-staging delete job db-migrate --ignore-not-found
          sed "s|coordinator:latest|coordinator:${GITHUB_SHA}|" infra/k8s/staging/db-migrate-job.yml | kubectl apply -f -
          kubectl -n scirm-staging wait --for=condition=complete job/db-migrate --timeout=300s             || { kubectl -n scirm-staging logs job/db-migrate; exit 1; }
      - name: Apply manifests
        # secrets.example.yml is a template; real secrets are created out of band.
        run: |
          kubectl apply -f infra/k8s/staging/all-services.yml
          kubectl apply -f infra/k8s/staging/coordinator-deployment.yml
      - name: Pin images to this build and wait for rollout
        # Only these services have staging manifests so far; the other images are
        # built and pushed but not deployed until their manifests exist.
        run: |
          for svc in api-gateway coordinator planner researcher executor reviewer frontend; do
            kubectl -n scirm-staging set image "deployment/$svc" "$svc=${IMAGE_PREFIX}/$svc:${GITHUB_SHA}"
          done
          for svc in api-gateway coordinator planner researcher executor reviewer frontend; do
            kubectl -n scirm-staging rollout status "deployment/$svc" --timeout=300s
          done
      - name: Smoke test
        run: |
          host=$(kubectl -n scirm-staging get svc api-gateway -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}')
          test -n "$host" || { echo "api-gateway has no external address"; exit 1; }
          curl -fsS --retry 10 --retry-delay 6 "http://$host/ready"

  release:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
