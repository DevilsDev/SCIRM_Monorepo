name: "🌙 Nightly Documentation Rebuild"

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: nightly-docs-rebuild
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  nightly-rebuild:
    name: "Nightly Rebuild and Deploy"
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout firebase-hosting branch
      uses: actions/checkout@v4
      with:
        ref: firebase-hosting
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install MkDocs and plugins
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs-material mkdocs-mermaid2-plugin mkdocs-macros-plugin

    - name: Validate secrets
      run: |
        echo "🔍 Validating required secrets for nightly rebuild..."
        if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" ]; then
          echo "❌ FIREBASE_SERVICE_ACCOUNT_KEY secret not found"
          exit 1
        fi
        if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
          echo "❌ FIREBASE_PROJECT_ID secret not found"
          exit 1
        fi
        echo "✅ All required secrets are available"

    - name: Content sanitizer check
      run: |
        echo "🔍 Running nightly content sanitizer..."
        
        # Check for dashboard directories in docs/
        if find docs/ -path "*/dashboards/*" -name "*.md" | grep -q .; then
          echo "❌ SECURITY VIOLATION: Internal dashboard content found in firebase-hosting"
          echo "Found files:"
          find docs/ -path "*/dashboards/*" -name "*.md"
          echo ""
          echo "This should not happen - investigating branch contamination"
          exit 1
        fi
        
        # Check for repository links
        REPO_LINKS=$(find docs/ -name "*.md" -exec grep -H "github\.com" {} \; || true)
        if [ -n "$REPO_LINKS" ]; then
          echo "❌ POLICY VIOLATION: Repository links found in documentation"
          echo "$REPO_LINKS"
          echo ""
          echo "Repository links detected in nightly scan"
          exit 1
        fi
        
        echo "✅ Nightly content sanitizer passed"

    - name: Build MkDocs site
      run: |
        echo "🏗️ Building MkDocs site for nightly deployment..."
        mkdocs build --strict
        
        # Validate build output
        if [ ! -d "site" ]; then
          echo "❌ Build failed - site directory not created"
          exit 1
        fi
        
        echo "✅ MkDocs build completed successfully"

    - name: Setup Firebase CLI
      run: |
        npm install -g firebase-tools

    - name: Authenticate with Firebase
      env:
        FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      run: |
        echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > ${{ runner.temp }}/firebase-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=${{ runner.temp }}/firebase-key.json
        firebase --version
        firebase use $FIREBASE_PROJECT_ID

    - name: Deploy to Firebase Hosting
      env:
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
      run: |
        echo "🚀 Deploying nightly rebuild to Firebase Hosting..."
        
        # Copy site to firebase hosting directory
        mkdir -p firebase/hosting
        cp -r site/* firebase/hosting/
        
        # Deploy from firebase directory
        cd firebase
        firebase deploy --only hosting --non-interactive
        
        echo "✅ Nightly deployment completed successfully"
        echo "🌐 Site URL: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"

    - name: Generate nightly evidence
      run: |
        echo "📋 Generating nightly deployment evidence..."
        
        # Create evidence directory
        mkdir -p compliance/artifacts/deployment-logs
        
        # Generate evidence JSON
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        EVIDENCE_FILE="compliance/artifacts/deployment-logs/nightly-rebuild-${TIMESTAMP}.json"
        
        cat > "$EVIDENCE_FILE" << EOF
        {
          "deployment_target": "Firebase Hosting",
          "deployment_type": "nightly_rebuild",
          "branch": "firebase-hosting",
          "commit_sha": "${{ github.sha }}",
          "timestamp": "$TIMESTAMP",
          "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          "site_url": "https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app",
          "actor": "github-actions[nightly]",
          "event": "schedule",
          "repository": "${{ github.repository }}",
          "validation_checks": {
            "branch_compliance": true,
            "no_internal_content": true,
            "build_success": true,
            "secrets_validated": true,
            "content_sanitized": true
          },
          "deployment_metadata": {
            "mkdocs_version": "$(pip show mkdocs | grep Version | cut -d' ' -f2)",
            "python_version": "$(python --version | cut -d' ' -f2)",
            "firebase_cli_version": "$(firebase --version | head -1)",
            "rebuild_reason": "nightly_maintenance"
          }
        }
        EOF
        
        echo "✅ Nightly evidence generated: $EVIDENCE_FILE"

    - name: Commit nightly evidence
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action (Nightly Rebuild Bot)"
        git add compliance/artifacts/deployment-logs/
        
        if git diff --staged --quiet; then
          echo "ℹ️ No evidence changes to commit"
        else
          git commit -S -m "evidence: Nightly documentation rebuild $(date -u +%Y%m%d-%H%M%S) [skip ci]

          Nightly rebuild and deployment evidence for firebase-hosting branch.
          
          Site: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app
          Workflow: ${{ github.run_id }}
          Timestamp: $(date -u)"
          git push
          echo "✅ Nightly evidence committed to firebase-hosting branch"
        fi

    - name: Nightly summary
      run: |
        echo ""
        echo "🌙 **Nightly Documentation Rebuild Complete**"
        echo "=============================================="
        echo ""
        echo "🌐 **Site URL:** https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"
        echo "🔗 **Commit:** ${{ github.sha }}"
        echo "📅 **Rebuilt:** $(date -u)"
        echo "🏗️ **Branch:** firebase-hosting"
        echo "🤖 **Actor:** Nightly Rebuild Bot"
        echo ""
        echo "✅ **Validation Checks Passed:**"
        echo "   • Content sanitizer (no internal content)"
        echo "   • No repository links detected"
        echo "   • MkDocs build successful"
        echo "   • Firebase deployment successful"
        echo ""
        echo "📋 **Evidence captured in:** compliance/artifacts/deployment-logs/"
        echo "🔄 **Next rebuild:** Tomorrow at 02:00 UTC"
