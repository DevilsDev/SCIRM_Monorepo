                // Check if issue already exists
                const existingIssues = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'all'
                });
                
                const exists = existingIssues.data.some(issue => issue.title === playbook.title);
                
                if (exists) {
                  console.log(`- Playbook already exists: ${playbook.title}`);
                  continue;
                }
                
                if (!context.payload.inputs.dry_run || context.payload.inputs.dry_run === 'false') {
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: playbook.title,
                    body: playbook.body,
                    labels: playbook.labels
                  });
                }
                console.log(`✓ Created playbook: ${playbook.title}`);
              } catch (error) {
                console.error(`✗ Failed to create playbook ${playbook.title}:`, error.message);
              }
