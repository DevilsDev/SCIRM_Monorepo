name: "🔥 Deploy Firebase Hosting (firebase-hosting branch only)"

on:
  push:
    branches: [ firebase-hosting ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  validate-branch:
    name: "Validate Deploy Branch"
    runs-on: ubuntu-latest
    steps:
    - name: Validate deploy branch
      run: |
        if [ "${GITHUB_REF}" != "refs/heads/firebase-hosting" ]; then
          echo "🚫 DEPLOYMENT BLOCKED: Only firebase-hosting may deploy"
          echo "Current branch: ${GITHUB_REF}"
          echo "Required branch: refs/heads/firebase-hosting"
          exit 1
        fi
        echo "✅ Branch validation passed - deploying from firebase-hosting"

  check-secrets:
    name: "Check Required Secrets"
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
    - name: Check secrets
      run: |
        test -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" || { echo "❌ Missing FIREBASE_SERVICE_ACCOUNT_KEY"; exit 1; }
        test -n "${{ secrets.FIREBASE_PROJECT_ID }}" || { echo "❌ Missing FIREBASE_PROJECT_ID"; exit 1; }
        echo "✅ Required secrets validated"

  build-mkdocs:
    name: "Build MkDocs Site"
    runs-on: ubuntu-latest
    needs: [validate-branch, check-secrets]
    
    steps:
    - name: Checkout firebase-hosting branch
      uses: actions/checkout@v4
      with:
        ref: firebase-hosting
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install MkDocs and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs-material
        pip install mkdocs-mermaid2-plugin
        pip install mkdocs-git-revision-date-localized-plugin

    - name: Build MkDocs site
      id: build-status
      run: |
        echo "🏗️ Building MkDocs documentation site..."
        mkdocs build --strict
        echo "✅ MkDocs build completed successfully"
        echo "status=success" >> $GITHUB_OUTPUT

  sanitize-content:
    name: "Sanitize Content"
    runs-on: ubuntu-latest
    needs: build-mkdocs
    outputs:
      docs-content-sanitized: ${{ steps.sanitizer.outputs.status }}
    steps:
    - name: Checkout firebase-hosting branch
      uses: actions/checkout@v4
      with:
        ref: firebase-hosting
        fetch-depth: 0

    - name: Content sanitizer and security scan
      id: sanitizer
      run: |
        # Check for dashboard directories in docs/
        if find docs/ -path "*/dashboards/*" -name "*.md" | grep -q .; then
          echo "❌ SECURITY VIOLATION: Internal dashboard content found in public docs"
          exit 1
        fi
        
        # Check for compliance dashboards
        if find compliance/ -path "*/dashboards/*" -name "*.md" 2>/dev/null | grep -q .; then
          echo "❌ SECURITY VIOLATION: Compliance dashboard content found"
          exit 1
        fi
        
        # Check for external links not in allow-list
        ALLOWED_DOMAINS="scirm-dd5c3.web.app"
        EXTERNAL_LINKS=$(find docs/ -name "*.md" -exec grep -H "https\?://" {} \; | grep -v -E "(https://(${ALLOWED_DOMAINS})|mailto:|tel:)" || true)
        if [ -n "$EXTERNAL_LINKS" ]; then
          echo "⚠️ WARNING: External links found (review required):"
          echo "$EXTERNAL_LINKS"
        fi
        
        # Check for repository links
        REPO_LINKS=$(find docs/ -name "*.md" -exec grep -H "github\.com" {} \; || true)
        if [ -n "$REPO_LINKS" ]; then
          echo "❌ SECURITY VIOLATION: Repository links found in documentation"
          exit 1
        fi
        
        echo "✅ Content sanitizer passed - safe for public deployment"
        echo "status=success" >> $GITHUB_OUTPUT

  deploy-to-firebase:
    name: "Deploy to Firebase"
    runs-on: ubuntu-latest
    needs: [validate-branch, check-secrets, build-mkdocs, sanitize-content]

    steps:
    - name: Checkout firebase-hosting branch
      uses: actions/checkout@v4
      with:
        ref: firebase-hosting
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install MkDocs and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs-material
        pip install mkdocs-mermaid2-plugin
        pip install mkdocs-git-revision-date-localized-plugin

    - name: Setup Firebase CLI
      run: |
        npm install -g firebase-tools
        firebase --version

    - name: Authenticate with Firebase
      env:
        FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      run: |
        echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > $HOME/firebase-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json
        firebase use $FIREBASE_PROJECT_ID
        echo "✅ Firebase authentication successful"

    - name: Deploy to Firebase Hosting
      env:
        FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      run: |
        echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > $HOME/firebase-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json
        
        # Copy built site to firebase directory
        rm -rf firebase/public/*
        cp -r site/* firebase/public/
        
        # Deploy from firebase directory
        cd firebase
        firebase deploy --only hosting --non-interactive
        
        echo "✅ Deployment completed successfully"
        echo "🌐 Site URL: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"

  write-deployment-evidence:
    name: "Write Deployment Evidence"
    runs-on: ubuntu-latest
    needs: [validate-branch, check-secrets, build-mkdocs, sanitize-content, deploy-to-firebase]

    steps:
    - name: Checkout firebase-hosting branch
      uses: actions/checkout@v4
      with:
        ref: firebase-hosting
        fetch-depth: 0

    - name: Generate deployment evidence
      run: |
        echo "📋 Generating deployment evidence..."
        
        # Create evidence directory
        mkdir -p compliance/artifacts/deployment-logs
        
        # Generate evidence JSON with exact schema
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        SHORT_SHA=$(git rev-parse --short HEAD)
        EVIDENCE_FILE="compliance/artifacts/deployment-logs/firebase-hosting-deploy-${TIMESTAMP}.json"
        
        cat > "$EVIDENCE_FILE" << EOF
        {
          "artifact_type": "deployment",
          "deployment_target": "Firebase Hosting",
          "site_url": "https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app",
          "branch": "firebase-hosting",
          "commit_sha": "${{ github.sha }}",
          "short_sha": "$SHORT_SHA",
          "timestamp": "$TIMESTAMP",
          "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          "mkdocs_version": "$(pip show mkdocs | grep Version | cut -d' ' -f2 || echo 'unknown')",
          "sanitizer_summary": {
            "external_links_blocked": 0,
            "dashboard_content_detected": false,
            "allowlist": ["https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"]
          },
          "status": "success"
        }
        EOF
        
        echo "✅ Deployment evidence generated: $EVIDENCE_FILE"

    - name: Commit evidence to firebase-hosting branch
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action (Firebase Deploy Bot)"
        git add compliance/artifacts/deployment-logs/
        
        if git diff --staged --quiet; then
          echo "ℹ️ No evidence changes to commit"
        else
          git commit -S -m "evidence: Firebase deployment $(date -u +%Y%m%d-%H%M%S) [skip ci]

          Automated deployment evidence for firebase-hosting branch.

          Site: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app
          Commit: $(git rev-parse --short HEAD)
          Workflow: ${{ github.run_id }}
          Timestamp: $(date -u)"
          git push
          echo "✅ Deployment evidence committed to firebase-hosting branch"
        fi

    - name: Deployment summary
      run: |
        echo ""
        echo "🎉 **Firebase Hosting Deployment Complete**"
        echo "============================================="
        echo ""
        echo "🌐 **Site URL:** https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"
        echo "🔗 **Commit:** ${{ github.sha }}"
        echo "📅 **Deployed:** $(date -u)"
        echo "🏗️ **Branch:** firebase-hosting"
        echo "👤 **Actor:** ${{ github.actor }}"
        echo ""
        echo "✅ **Validation Checks Passed:**"
        echo "   • Branch compliance (firebase-hosting only)"
        echo "   • No internal dashboard content"
        echo "   • MkDocs build successful"
        echo "   • Security scan passed"
        echo "   • Firebase deployment successful"
        echo ""
        echo "📋 **Evidence captured in:** compliance/artifacts/deployment-logs/"
        echo "🔒 **Next deployment:** Merge changes to main → PR to firebase-hosting → merge"
