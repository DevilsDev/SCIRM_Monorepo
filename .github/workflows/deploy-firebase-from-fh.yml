name: "🔥 Deploy Firebase Hosting (firebase-hosting branch only)"

on:
  push:
    branches: [ firebase-hosting ]
  workflow_dispatch:

concurrency:
  group: deploy-firebase-firebase-hosting
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    name: "Deploy to Firebase Hosting"
    runs-on: ubuntu-latest
    
    steps:
    - name: Validate branch (firebase-hosting only)
      run: |
        echo "🔍 Validating deployment branch..."
        echo "Current ref: ${{ github.ref }}"
        echo "Required ref: refs/heads/firebase-hosting"
        
        if [ "${{ github.ref }}" != "refs/heads/firebase-hosting" ]; then
          echo ""
          echo "🚫 **DEPLOYMENT BLOCKED**"
          echo "❌ Firebase Hosting deployments are ONLY allowed from firebase-hosting branch"
          echo "Current branch: ${{ github.ref_name }}"
          echo ""
          echo "✅ **Correct Process:**"
          echo "1. Merge changes to main via PR (with reviews + checks)"
          echo "2. Create PR from main → firebase-hosting"
          echo "3. Merge to firebase-hosting → triggers deployment"
          echo ""
          echo "🔒 **Security Policy:**"
          echo "This ensures all deployments go through proper review process"
          exit 1
        fi
        
        echo "✅ Branch validation passed - deploying from firebase-hosting"

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install MkDocs and plugins
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs-material mkdocs-mermaid2-plugin

    - name: Validate secrets
      run: |
        echo "🔍 Validating required secrets..."
        if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" ]; then
          echo "❌ FIREBASE_SERVICE_ACCOUNT_KEY secret not found"
          exit 1
        fi
        if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
          echo "❌ FIREBASE_PROJECT_ID secret not found"
          exit 1
        fi
        echo "✅ All required secrets are available"

    - name: Security scan - Check for internal content
      run: |
        echo "🔍 Scanning for internal dashboard content..."
        
        # Check for dashboard directories in docs/
        if find docs/ -path "*/dashboards/*" -name "*.md" | grep -q .; then
          echo "❌ SECURITY VIOLATION: Internal dashboard content found in public docs"
          echo "Found files:"
          find docs/ -path "*/dashboards/*" -name "*.md"
          echo ""
          echo "Internal dashboards must remain on internal-dashboards branch only"
          exit 1
        fi
        
        # Check for compliance dashboards
        if find compliance/ -path "*/dashboards/*" -name "*.md" 2>/dev/null | grep -q .; then
          echo "❌ SECURITY VIOLATION: Compliance dashboard content found"
          echo "Compliance dashboards must not be deployed publicly"
          exit 1
        fi
        
        echo "✅ No internal dashboard content found - safe for public deployment"

    - name: Build MkDocs site
      run: |
        echo "🏗️ Building MkDocs site..."
        mkdocs build --strict
        
        # Validate build output
        if [ ! -d "site" ]; then
          echo "❌ Build failed - site directory not created"
          exit 1
        fi
        
        # Check for accidental dashboard content in build
        if find site/ -path "*/dashboards/*" -name "*.html" | grep -q .; then
          echo "❌ Dashboard content found in build output"
          find site/ -path "*/dashboards/*" -name "*.html"
          exit 1
        fi
        
        echo "✅ MkDocs build completed successfully"

    - name: Setup Firebase CLI
      run: |
        npm install -g firebase-tools

    - name: Authenticate with Firebase
      env:
        FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      run: |
        echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > ${{ runner.temp }}/firebase-key.json
        export GOOGLE_APPLICATION_CREDENTIALS=${{ runner.temp }}/firebase-key.json
        firebase --version
        firebase use $FIREBASE_PROJECT_ID

    - name: Deploy to Firebase Hosting
      env:
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
      run: |
        echo "🚀 Deploying to Firebase Hosting..."
        
        # Copy site to firebase hosting directory
        mkdir -p firebase/hosting
        cp -r site/* firebase/hosting/
        
        # Deploy from firebase directory
        cd firebase
        firebase deploy --only hosting --non-interactive
        
        echo "✅ Deployment completed successfully"
        echo "🌐 Site URL: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"

    - name: Generate deployment evidence
      run: |
        echo "📋 Generating deployment evidence..."
        
        # Create evidence directory
        mkdir -p compliance/artifacts/deployment-logs
        
        # Generate evidence JSON
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        EVIDENCE_FILE="compliance/artifacts/deployment-logs/firebase-hosting-deploy-${TIMESTAMP}.json"
        
        cat > "$EVIDENCE_FILE" << EOF
        {
          "deployment_target": "Firebase Hosting",
          "branch": "firebase-hosting",
          "commit_sha": "${{ github.sha }}",
          "timestamp": "$TIMESTAMP",
          "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          "site_url": "https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app",
          "actor": "${{ github.actor }}",
          "event": "${{ github.event_name }}",
          "repository": "${{ github.repository }}",
          "validation_checks": {
            "branch_compliance": true,
            "no_internal_content": true,
            "build_success": true,
            "secrets_validated": true,
            "security_scan_passed": true
          },
          "deployment_metadata": {
            "mkdocs_version": "$(pip show mkdocs | grep Version | cut -d' ' -f2)",
            "python_version": "$(python --version | cut -d' ' -f2)",
            "firebase_cli_version": "$(firebase --version | head -1)"
          }
        }
        EOF
        
        echo "✅ Evidence generated: $EVIDENCE_FILE"

    - name: Commit evidence to firebase-hosting branch
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action (Firebase Deploy Bot)"
        git add compliance/artifacts/deployment-logs/
        
        if git diff --staged --quiet; then
          echo "ℹ️ No evidence changes to commit"
        else
          git commit -S -m "evidence: Firebase hosting deployment $(date -u +%Y%m%d-%H%M%S) [skip ci]

          Deployment evidence for commit ${{ github.sha }}
          Site: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app
          Workflow: ${{ github.run_id }}"
          git push
          echo "✅ Evidence committed to firebase-hosting branch"
        fi

    - name: Deployment summary
      run: |
        echo ""
        echo "🎉 **Firebase Hosting Deployment Complete**"
        echo "============================================="
        echo ""
        echo "🌐 **Site URL:** https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"
        echo "🔗 **Commit:** ${{ github.sha }}"
        echo "📅 **Deployed:** $(date -u)"
        echo "🏗️ **Branch:** firebase-hosting"
        echo "👤 **Actor:** ${{ github.actor }}"
        echo ""
        echo "✅ **Validation Checks Passed:**"
        echo "   • Branch compliance (firebase-hosting only)"
        echo "   • No internal dashboard content"
        echo "   • MkDocs build successful"
        echo "   • Security scan passed"
        echo "   • Firebase deployment successful"
        echo ""
        echo "📋 **Evidence captured in:** compliance/artifacts/deployment-logs/"
        echo "🔒 **Next deployment:** Merge changes to main → PR to firebase-hosting → merge"
