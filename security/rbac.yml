# Role-Based Access Control (RBAC) Configuration for SCIRM Platform

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: scirm-staging
  name: scirm-service-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scirm-service-binding
  namespace: scirm-staging
subjects:
- kind: ServiceAccount
  name: scirm-service-account
  namespace: scirm-staging
roleRef:
  kind: Role
  name: scirm-service-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scirm-service-account
  namespace: scirm-staging
---
# Application-level RBAC Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-rbac-config
  namespace: scirm-staging
data:
  roles.json: |
    {
      "roles": {
        "admin": {
          "permissions": [
            "assessments:create",
            "assessments:read",
            "assessments:update",
            "assessments:delete",
            "organizations:manage",
            "users:manage",
            "system:configure",
            "reports:export"
          ]
        },
        "analyst": {
          "permissions": [
            "assessments:create",
            "assessments:read",
            "assessments:update",
            "reports:view",
            "recommendations:view"
          ]
        },
        "viewer": {
          "permissions": [
            "assessments:read",
            "reports:view",
            "recommendations:view"
          ]
        },
        "auditor": {
          "permissions": [
            "assessments:read",
            "audit_logs:read",
            "compliance:view",
            "reports:export"
          ]
        }
      },
      "resource_permissions": {
        "assessments": ["create", "read", "update", "delete"],
        "organizations": ["manage"],
        "users": ["manage"],
        "system": ["configure"],
        "reports": ["view", "export"],
        "recommendations": ["view"],
        "audit_logs": ["read"],
        "compliance": ["view"]
      }
    }
